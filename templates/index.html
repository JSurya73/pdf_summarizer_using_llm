<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Upload a PDF File</h1>

    <form id="uploadForm">
        <input type="file" name="pdf" id="pdf_file" accept="application/pdf" required />
        <br><br>
        <button type="submit">Upload</button>
    </form>

    <div id="response"></div>

    <!-- Loading Modal -->
    <div id="loadingModal">
        <div id="loadingContent">
            Uploading... Please wait.
        </div>
    </div>
